version: "3"

tasks:
  init:
    desc: Initialize development environment
    cmds:
      - git submodule sync --recursive
      - git submodule update --init --recursive
      - task: init-config

  init-config:
    desc: Copy default configs to local if missing
    cmds:
      - mkdir -p config/local
      - cp -n config/defaults/*.ini config/local/ || true
      - echo "Local configuration initialized in config/local/"

  clean:
    desc: Clean up configurations
    cmds:
      - rm -rf config/local
      - echo "Local configuration removed."

  docs:
    desc: Generate or serve documentation (placeholder)
    cmds:
      - echo "See README.md for documentation."

  version:
    desc: Show version from git
    cmds:
      - bash scripts/version.sh

  build-packages:
    desc: Build all Debian packages
    cmds:
      - bash packaging/build-packages.sh

  test-packages:
    desc: Test built packages
    cmds:
      - bash packaging/test-packages.sh

  test-systemd:
    desc: Test packages in systemd container
    cmds:
      - bash scripts/test-systemd.sh
