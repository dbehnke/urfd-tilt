services:
  urfd:
    image: urfd:${IMAGE_VERSION:-latest}
    command: urfd /usr/local/etc/urfd/urfd.ini
    ports:
      # D-Star protocols
      - "${PORT_DEXTRA:-30001}:30001/udp"  # DExtra
      - "${PORT_DPLUS:-20001}:20001/udp"  # DPlus
      - "${PORT_DCS:-30051}:30051/udp"  # DCS
      # DMR protocols
      - "${PORT_DMRPLUS:-8880}:8880/udp"    # DMRPlus
      - "${PORT_MMDVM:-62030}:62030/udp"  # MMDVM
      # Other protocols
      - "${PORT_M17:-17000}:17000/udp"  # M17
      - "${PORT_YSF:-42000}:42000/udp"  # YSF
      - "${PORT_P25:-41000}:41000/udp"  # P25
      - "${PORT_NXDN:-41400}:41400/udp"  # NXDN
      - "${PORT_URF:-10017}:10017/udp"  # URF
      # TCP ports
      - "${PORT_TRANSCODER:-10100}:10100/tcp"  # Transcoder
      - "${PORT_G3:-40000}:40000/tcp"  # G3 Terminal
      - "${PORT_NNG_DASHBOARD:-5555}:5555/tcp"    # NNG Dashboard
      - "${PORT_NNG_VOICE:-5556}:5556/tcp"    # NNG Voice (audio data - PAIR)
      - "${PORT_NNG_CONTROL:-6556}:6556/tcp"    # NNG Voice Control (PTT control - REP)
    volumes:
      - ${CONFIG_DIR:-./config/local}:/usr/local/etc/urfd:ro
      - ${LOG_DIR:-./data/logs}:/var/log/urfd
      - ${AUDIO_DIR:-./data/audio}:/usr/local/bin/audio
    restart: unless-stopped

  tcd:
    image: tcd:${IMAGE_VERSION:-latest}
    command: tcd /usr/local/etc/tcd/tcd.ini
    network_mode: service:urfd
    depends_on:
      - urfd
    volumes:
      - ${CONFIG_DIR:-./config/local}:/usr/local/etc/tcd:ro
    restart: unless-stopped

  dashboard:
    image: dashboard:${IMAGE_VERSION:-latest}
    command: dashboard -config /etc/dashboard/config.yaml
    ports:
      - "${PORT_DASHBOARD_HTTP:-8080}:8080/tcp"    # Dashboard HTTP
    environment:
      - URFD_HOST=urfd
    depends_on:
      - urfd
    volumes:
      - ${DASHBOARD_CONFIG_DIR:-./config/dashboard}:/etc/dashboard:ro
      - ${AUDIO_DIR:-./data/audio}:/usr/local/bin/audio:ro
      - ${DASHBOARD_DATA_DIR:-./data/dashboard}:/app/data
    restart: unless-stopped
