name: "Packaging - multi-arch"

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-packages:
    name: "Build packages (matrix: ${{ matrix.arch }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup buildx
        uses: docker/setup-buildx-action@v2

      - name: Setup Go (for nfpm)
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Install nfpm
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "nfpm installed to $(go env GOPATH)/bin"

      - name: Ensure dist and artifacts directories
        run: |
          mkdir -p dist artifacts

      - name: "Build packages (SINGLE_ARCH=${{ matrix.arch }})"
        env:
          SINGLE_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          echo "Running packaging/build-packages.sh for arch=${SINGLE_ARCH}"
          bash packaging/build-packages.sh

      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian

      - name: "Run lintian and fail on unexpected E: tags"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          lintian --display-info --display-experimental --show-overrides dist/*.deb > artifacts/lintian-output.txt || true
          # Extract only E: lines and filter allowed/accepted tags
          grep '^E:' artifacts/lintian-output.txt || true
          # Whitelist intentional/stated exceptions here (tag text as shown by lintian)
          ALLOWED='statically-linked-binary'
          awk '/^E:/ {print}' artifacts/lintian-output.txt | grep -v -F "$ALLOWED" > artifacts/lintian-errors.txt || true
          if [ -s artifacts/lintian-errors.txt ]; then
            echo "Unexpected lintian E: errors found:"; cat artifacts/lintian-errors.txt; echo; cat artifacts/lintian-output.txt; exit 1
          fi

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.deb

      - name: Upload lintian output
        uses: actions/upload-artifact@v4
        with:
          name: lintian-output-${{ matrix.arch }}
          path: artifacts/lintian-output.txt
