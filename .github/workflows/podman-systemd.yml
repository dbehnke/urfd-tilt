name: Podman Systemd Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  package:
    name: Build Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run packaging script (arch: ${{ matrix.arch }})
        run: |
          # Ensure Docker and buildx are available on the runner so
          # packaging/build-packages.sh can use docker buildx and docker run.
          sudo apt-get update
          sudo apt-get -y install docker.io binfmt-support qemu-user-static || true
          sudo systemctl start docker || true
          # Register qemu handlers (best-effort) for multi-arch buildx
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true
          # Create and use a buildx builder so `docker buildx build` works reliably
          sudo docker buildx create --use --name urfd-builder || true

          chmod +x packaging/build-packages.sh || true
          export SINGLE_ARCH=${{ matrix.arch }}
          echo "Building for arch ${SINGLE_ARCH}"
          SINGLE_ARCH=${SINGLE_ARCH} ./packaging/build-packages.sh

      - name: Upload dist artifact (arch: ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  podman-test:
    name: Podman Systemd Test
    runs-on: ubuntu-latest
    needs: package
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact for arch ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman jq

      - name: (arm64 emulation) Install QEMU handlers if testing arm64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get -y install qemu-user-static binfmt-support docker.io || true
          sudo systemctl start docker || true
          # register QEMU handlers (best-effort)
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Build Debian trixie systemd image
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then PLAT="linux/arm64"; else PLAT="linux/amd64"; fi
          sudo docker buildx build --platform "$PLAT" -f scripts/docker/debian-trixie-systemd.Dockerfile -t local/debian-trixie-systemd:${{ matrix.arch }} --load .

      - name: Ensure lint & govulncheck tools are available
        run: |
          # Install golangci-lint and govulncheck to match local Taskfile targets
          sudo apt-get update
          sudo apt-get -y install golang-go ca-certificates make git wget curl || true
          export GOPATH="${HOME}/go"
          export PATH="$GOPATH/bin:$PATH"
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest || true
          go install golang.org/x/vuln/cmd/govulncheck@latest || true

      - name: Run systemd tests
        run: |
          IMAGE="local/debian-trixie-systemd:${{ matrix.arch }}"
          echo "Using image: $IMAGE"
          bash scripts/test-systemd.sh --dist ./dist --image "$IMAGE"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-systemd-artifacts-${{ matrix.arch }}
          path: artifacts/

      - name: Cleanup containers
        if: always()
        run: |
          set -e || true
          pods=$(podman ps -a -q || true)
          if [ -n "$pods" ]; then
            podman rm -f $pods || true
          fi
