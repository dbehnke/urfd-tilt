name: Packaging — podman systemd tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  podman-systemd-test:
    name: Podman + systemd validation (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Go (for nfpm install)
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install nfpm
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Podman
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman uidmap

      - name: Build systemd test image (kmod variant)
        run: |
          set -euo pipefail
          podman build -t local/debian-trixie-systemd-kmod:latest \
            -f scripts/docker/debian-trixie-systemd-kmod.Dockerfile \
            scripts/docker

      - name: Build packages (amd64)
        env:
          SINGLE_ARCH: amd64
        run: |
          set -euo pipefail
          bash packaging/build-packages.sh

      - name: Run systemd package test harness
        run: |
          set -euo pipefail
          bash scripts/test-systemd.sh \
            --dist ./dist \
            --image local/debian-trixie-systemd-kmod:latest \
            --fail-on-service-failed

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-systemd-output
          path: artifacts

      - name: Upload built debs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-amd64-systemd-tested
          path: dist/*.deb
