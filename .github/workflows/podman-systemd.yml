name: Packaging — podman systemd tests

on:
  workflow_dispatch:

jobs:
  podman-systemd-test:
    name: Podman + systemd validation
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-amd64
          path: dist/amd64 || true

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-arm64
          path: dist/arm64 || true

      - name: Install Podman
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman uidmap

      - name: Prepare systemd-enabled container image
        run: |
          set -euo pipefail
          # Use Debian trixie base and enable systemd; image will be ephemeral
          CONTAINER_IMAGE=debian:trixie
          echo "Using container image: $CONTAINER_IMAGE"

      - name: Run systemd test harness inside Podman
        env:
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          mkdir -p test-output
          echo "Listing debs in workspace dist:"
          ls -lah dist || true

          # Attempt to run systemd-backed container and run test script. This is a best-effort run in Actions.
          # scripts/test-systemd.sh should be present in repo and operate on /dist inside container.
          podman run --rm --privileged -v ${GITHUB_WORKSPACE}/dist:/dist:Z -v ${GITHUB_WORKSPACE}/scripts:/scripts:Z \
            --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            --name urfd-pack-test debian:trixie /sbin/init &
          CONTAINER_ID=$!
          echo "Started container PID $CONTAINER_ID; waiting 6s for systemd to settle"
          sleep 6
          # Copy and run the harness inside container using nsenter-like approach
          podman exec -t $(podman ps -q --filter name=urfd-pack-test) /bin/bash -xc "set -euo pipefail; /scripts/test-systemd.sh /dist /test-output || exit 0"
          podman stop $(podman ps -q --filter name=urfd-pack-test) || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podman-systemd-output
          path: test-output
