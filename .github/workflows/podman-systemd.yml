name: Podman Systemd Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  package:
    name: Build Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run packaging script (arch: ${{ matrix.arch }})
        run: |
          chmod +x packaging/build-packages.sh || true
          export SINGLE_ARCH=${{ matrix.arch }}
          echo "Building for arch ${SINGLE_ARCH}"
          SINGLE_ARCH=${SINGLE_ARCH} ./packaging/build-packages.sh

      - name: Upload dist artifact (arch: ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  podman-test:
    name: Podman Systemd Test
    runs-on: ubuntu-latest
    needs: package
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact for arch ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman jq

      - name: (arm64 emulation) Install QEMU handlers if testing arm64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get -y install qemu-user-static binfmt-support || true
          # register QEMU handlers (best-effort), docker is available on runner
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Run systemd tests
        run: |
          bash scripts/test-systemd.sh --dist ./dist --image docker.io/library/ubuntu:22.04

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman-systemd-artifacts-${{ matrix.arch }}
          path: artifacts/

      - name: Cleanup containers
        if: always()
        run: |
          set -e || true
          pods=$(podman ps -a -q || true)
          if [ -n "$pods" ]; then
            podman rm -f $pods || true
          fi
