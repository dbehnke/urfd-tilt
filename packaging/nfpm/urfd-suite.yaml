# urfd-suite: Lightweight meta-package for core URFD components
#
# Use this package when:
# - You want dependencies-only installation without directory creation
# - You prefer to use 'tcd' package instead of 'urfd-tcd'
# - You don't need the full server setup
#
# Note: Depends on 'tcd' package, not 'urfd-tcd'. Does not create directories.

name: urfd-suite
arch: all
platform: linux
version: ${PKG_VERSION}
maintainer: "URFD Project <maintainers@urfd.example.org>"
section: misc
vendor: "URFD"
homepage: "https://github.com/dbehnke/urfd"
description: |
  URFD meta-package that pulls together core components.

  This meta-package installs the core URFD components (urfd, urfd-dashboard and
  tcd). It is intended as a convenience meta-package for simple installations
  and does not create runtime directories or configuration files.

depends:
  - urfd
  - urfd-dashboard
  - tcd

contents:
  - src: packaging/docs/COPYRIGHT
    dst: /usr/share/doc/urfd-suite/copyright
    file_info:
      mode: 0644
  # changelog handled as plain file; nfpm/deb packager will compress as needed
  - src: packaging/docs/changelog.Debian.gz
    dst: /usr/share/doc/urfd-suite/changelog.Debian.gz
    file_info:
      mode: 0644
