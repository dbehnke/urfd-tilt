name: urfd-tcd
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
maintainer: "URFD Packaging Team <packaging@urfd.example.org>"
description: |
  URFD TCD integration package. Provides helper scripts and unit files needed
  to run the transcoder (tcd) integrated with URFD services.
section: sound
vendor: "URFD"
homepage: "https://github.com/dbehnke/urfd"
description: |
  URFD TCD - Transcode Daemon
  Handles audio transcoding for the URFD system.

depends:
  - urfd
  - systemd

contents:
  - src: dist/build-${ARCH}/tcd/tcd
    dst: /usr/bin/tcd
    file_info:
      mode: 0755
  - src: packaging/configs/tcd.ini
    dst: /etc/urfd/tcd.ini
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/systemd/urfd-tcd.service
    dst: /usr/lib/systemd/system/urfd-tcd.service
    file_info:
      mode: 0644
  - src: packaging/docs/COPYRIGHT
    dst: /usr/share/doc/urfd-tcd/copyright
    file_info:
      mode: 0644
