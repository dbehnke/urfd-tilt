name: urfd-dashboard
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
maintainer: "URFD Packaging Team <packaging@urfd.example.org>"
description: |
  Web-based management interface for URFD. Provides monitoring, configuration,
  and runtime controls for URFD instances.
section: web
vendor: "URFD"
homepage: "https://github.com/dbehnke/urfd"

depends:
  - urfd
  - systemd

contents:
  - src: dist/build-${ARCH}/urfd-nng-dashboard/urfd-dashboard
    dst: /usr/bin/urfd-dashboard
    file_info:
      mode: 0755
  - src: packaging/configs/dashboard.yaml
    dst: /etc/urfd/dashboard.yaml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/systemd/urfd-dashboard.service
    dst: /usr/lib/systemd/system/urfd-dashboard.service
    file_info:
      mode: 0644
  - src: packaging/docs/COPYRIGHT
    dst: /usr/share/doc/urfd-dashboard/copyright
    file_info:
      mode: 0644
  - src: packaging/docs/urfd-dashboard/changelog.Debian.gz
    dst: /usr/share/doc/urfd-dashboard/changelog.Debian.gz
    file_info:
      mode: 0644
  - src: packaging/docs/manpages/urfd.1.gz
    dst: /usr/share/man/man1/urfd-dashboard.1.gz
    file_info:
      mode: 0644
  - src: packaging/docs/urfd-dashboard/lintian-overrides
    dst: /usr/share/lintian/overrides/urfd-dashboard
    file_info:
      mode: 0644
