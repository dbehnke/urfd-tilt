name: urfd-dashboard
arch: ${ARCH}
platform: linux
version: 0.0.0
maintainer: "URFD Project"
vendor: "URFD"
homepage: "https://github.com/dbehnke/urfd"
description: |
  URFD NNG Dashboard - Web-based management interface
  Provides a web UI for monitoring and managing URFD instances.

depends:
  - urfd
  - systemd

contents:
  - src: dist/build-${ARCH}/urfd-nng-dashboard/urfd-dashboard
    dst: /usr/bin/urfd-dashboard
    file_info:
      mode: 0755
  - src: packaging/configs/dashboard.yaml
    dst: /etc/urfd/dashboard.yaml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/systemd/urfd-dashboard.service
    dst: /usr/lib/systemd/system/urfd-dashboard.service
    file_info:
      mode: 0644
