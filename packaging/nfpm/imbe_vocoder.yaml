name: imbe_vocoder
arch: ${ARCH}
platform: linux
version: 0.0.0
maintainer: "URFD Project"
vendor: "URFD"
homepage: "https://github.com/dbehnke/urfd"
description: |
  IMBE vocoder library

contents:
  - src: dist/build-${ARCH}/imbe_vocoder/libimbe_vocoder.a
    dst: /usr/local/lib/libimbe_vocoder.a
    file_info:
      mode: 0644
  - src: dist/build-${ARCH}/imbe_vocoder/*.h
    dst: /usr/local/include/
    type: config|noreplace
