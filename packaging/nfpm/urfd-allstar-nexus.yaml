name: urfd-allstar-nexus
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
maintainer: "URFD Project"
vendor: "URFD"
homepage: "https://github.com/dbehnke/urfd"
description: |
  URFD AllStar Nexus - AllStar network integration
  Provides integration with the AllStar Link network.

depends:
  - systemd

recommends:
  - urfd

contents:
  - src: dist/build-${ARCH}/allstar-nexus/allstar-nexus
    dst: /usr/bin/allstar-nexus
    file_info:
      mode: 0755
  - src: packaging/configs/allstar-nexus.yaml
    dst: /etc/urfd/allstar-nexus.yaml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/systemd/urfd-allstar-nexus.service
    dst: /usr/lib/systemd/system/urfd-allstar-nexus.service
    file_info:
      mode: 0644
