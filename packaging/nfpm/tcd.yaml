name: tcd
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
maintainer: "URFD Packaging Team <packaging@urfd.example.org>"
description: |
  Transcoding daemon for URFD. Handles audio format conversion and codec
  bridging between internal components and external clients. Installs the
  tcd binary and runtime configuration for the transcoding subsystem.
section: sound
vendor: "URFD"
homepage: "https://github.com/dbehnke/urfd"

depends:
  - urfd
  - systemd

contents:
  - src: dist/build-${ARCH}/tcd/tcd
    dst: /usr/bin/tcd
    file_info:
      mode: 0755
  # systemd unit is included above; avoid duplicate entry
  - src: packaging/bin/urfd-tcd-run
    dst: /usr/libexec/urfd/urfd-tcd-run
    file_info:
      mode: 0755
  - src: packaging/configs/tcd.ini
    dst: /etc/urfd/tcd.ini
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/docs/COPYRIGHT
    dst: /usr/share/doc/tcd/copyright
    file_info:
      mode: 0644
  - src: packaging/docs/tcd/changelog.Debian.gz
    dst: /usr/share/doc/tcd/changelog.Debian.gz
    file_info:
      mode: 0644
  - src: packaging/docs/manpages/tcd.1.gz
    dst: /usr/share/man/man1/tcd.1.gz
    file_info:
      mode: 0644
  - src: packaging/systemd/urfd-tcd.service
    dst: /usr/lib/systemd/system/urfd-tcd.service
    file_info:
      mode: 0644
