# TCD Configuration File
# Format: Key=Value
# Supported Keys:
# - ServerAddress
# - Port
# - Modules
# - DStarGainIn, DStarGainOut
# - DmrYsfGainIn, DmrYsfGainOut
# - UsrpTxGain, UsrpRxGain
# - AGC, AGCTargetLevel

# Wrapper / runtime notes:
# The systemd unit uses a small wrapper `/usr/bin/urfd-tcd-run` which auto-
# detects whether a hardware FTDI vocoder is present and selects hardware or
# software vocoding. You can force behavior using the environment variable
# `URFD_TCD_MODE=auto|hardware|software` (default: auto). In containerized
# test environments with no hardware present, the wrapper will fall back to
# software mode automatically.

# Connection to URFD (or Transcoder Server)
ServerAddress=127.0.0.1
Port=10100

# Modules to support (must match urfd config)
Modules=ADMSZ

# Audio Gains (dB)
DStarGainIn=16
DStarGainOut=-16
DmrYsfGainIn=-3
DmrYsfGainOut=0
UsrpTxGain=12
UsrpRxGain=-6

# AGC Settings
AGC=true
AGCTargetLevel=-18.0
