###### URF259 PRODUCTION CONFIGURATION ######
# Deployment for URF259 on whocares
# Ports offset by +2 from standard (e.g., 42002 instead of 42000)
# This file is checked into the repo as the canonical URF259 configuration.
# Secrets (SysopEmail, qrz_password) must be set via local override only.

[Names]
Callsign = URF259
SysopEmail = admin@whocaresradio.com
Country = US
Sponsor = USECA
DashboardUrl = https://urf259.whocaresradio.com
Bootstrap = xrf757.openquad.net

[IP Addresses]
IPv4Binding = 0.0.0.0
IPv4External = 67.220.71.98
# IPv6Binding = ::

[Modules]
Modules = A
DescriptionA = All Modes
DescriptionB = TAC
DescriptionC = DStar

[Dashboard]
Enable = true
NNGAddr = tcp://0.0.0.0:55552
Interval = 10
NNGDebug = false

[Audio]
Enable = true
path = /usr/local/bin/audio/

[Transcoder]
Port = 10102
BindingAddress = 127.0.0.1
Modules = A

# Protocols (all ports offset by +2)
[Brandmeister]
Enable = false
Port = 10003

[DCS]
Port = 30052

[DExtra]
Port = 30002

[DPlus]
Port = 20002

[G3]
Enable = true

[IMRS]
Enable = false
Port = 21110

[DMRPlus]
Port = 8882

[M17]
Port = 17002

[MMDVM]
Port = 62032
DefaultId = 3200449

[NXDN]
Port = 41402
AutoLinkModule = A
ReflectorID = 1259

[P25]
Port = 41002
AutoLinkModule = A
ReflectorID = 1259

[URF]
Port = 10012

[USRP]
Enable = true
Callsign = ALLSTAR
IPAddress = 127.0.0.1
RxPort = 34002
TxPort = 32002
Module = A

[DMR]
XlxCompatibility = false
SingleMode = false
HoldTime = 5
DefaultTimeout = 600
MapA = 7001
MapB = 7002
MapC = 7003

[YSF]
Port = 42002
AutoLinkModule = A
EnableDGID = true
DefaultTxFreq = 446500000
DefaultRxFreq = 446500000
RegistrationID = 28299
RegistrationName = US-ZOMBIE
RegistrationDescription = ZOMBIE-ALERT

######## Database files
[DMR ID DB]
Mode = http
FilePath = /tmp/dmrid.dat
URL = http://xlxapi.rlx.lu/api/exportdmr.php
RefreshMin = 179

[NXDN ID DB]
Mode = http
FilePath = /tmp/nxdn.dat
URL = https://radioid.net/static/nxdn.csv
RefreshMin = 1440

[YSF TX/RX DB]
Mode = http
FilePath = /tmp/ysfnode.dat
URL = http://xlxapi.rlx.lu/api/exportysfrepeaters.php
RefreshMin = 191

######### Other File locations
[Files]
PidPath = /var/run/xlxd.pid
XmlPath = /var/log/xlxd.xml
WhitelistPath = /usr/local/etc/urfd/urfd.whitelist
BlacklistPath = /usr/local/etc/urfd/urfd.blacklist
InterlinkPath = /usr/local/etc/urfd/urfd.interlink
G3TerminalPath = /usr/local/etc/urfd/urfd.terminal
M17InterlinkPath = /usr/local/etc/urfd/urfd.m17

######### Audio
[Audio]
Enable = true
Path = /usr/local/bin/audio/
