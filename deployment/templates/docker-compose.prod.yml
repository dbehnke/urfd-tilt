# URFD Production Docker Compose Template
# This file uses environment variables for configuration.
# Copy this to your instance directory and customize via .env file.
#
# Variable substitution is performed by deploy-instance.sh script.
#
# Networking mode:
#   - Bridge (default): explicit port mappings, isolated container network
#   - Host: containers share host network namespace (required for USRP/AllStar)
#
# To use host networking, set in your .env:
#   URFD_NETWORK_MODE=network_mode: host
#   TCD_NETWORK_MODE=network_mode: host
#   DASHBOARD_EXTRA_HOSTS=extra_hosts:\n      - "host.docker.internal:host-gateway"
#   DASHBOARD_URFD_HOST=host.docker.internal
#
# When using host networking, the 'ports:' section is ignored by Docker
# but must remain for compose file validity.

services:
  urfd:
    image: urfd-urfd:${IMAGE_VERSION}
    container_name: ${INSTANCE_NAME}-urfd
    command: urfd /usr/local/etc/urfd/urfd.ini
    # Network mode: leave URFD_NETWORK_MODE empty for bridge (default)
    # Set URFD_NETWORK_MODE=network_mode: host  for USRP/AllStar
    # ${URFD_NETWORK_MODE}
    # NOTE: When using host networking, uncomment the line above and remove
    # the 'ports:' section (Docker ignores ports in host mode anyway).
    ports:
      # D-Star protocols (UDP)
      - "${PORT_DEXTRA}:30001/udp"    # DExtra
      - "${PORT_DPLUS}:20001/udp"     # DPlus
      - "${PORT_DCS}:30051/udp"       # DCS
      # DMR protocols (UDP)
      - "${PORT_DMRPLUS}:8880/udp"    # DMRPlus
      - "${PORT_MMDVM}:62030/udp"     # MMDVM
      # Other protocols (UDP)
      - "${PORT_M17}:17000/udp"       # M17
      - "${PORT_YSF}:42000/udp"       # YSF
      - "${PORT_P25}:41000/udp"       # P25
      - "${PORT_NXDN}:41400/udp"      # NXDN
      - "${PORT_URF}:10017/udp"       # URF
      # TCP ports
      - "${PORT_TRANSCODER}:10100/tcp"  # Transcoder
      - "${PORT_G3}:40000/tcp"          # G3 Terminal
      - "${PORT_NNG_DASHBOARD}:5555/tcp"  # NNG Dashboard
      - "${PORT_NNG_VOICE}:5556/tcp"      # NNG Voice (audio data - PAIR)
      - "${PORT_NNG_CONTROL}:6556/tcp"    # NNG Voice Control (PTT control - REP)
    volumes:
      - ${INSTANCE_DIR}/config:/usr/local/etc/urfd:ro
      - ${INSTANCE_DIR}/data/logs:/var/log/urfd
      - ${INSTANCE_DIR}/data/audio:/usr/local/bin/audio
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tcd:
    image: urfd-tcd:${IMAGE_VERSION}
    container_name: ${INSTANCE_NAME}-tcd
    command: tcd /usr/local/etc/tcd/tcd.ini
    # TCD networking follows URFD:
    #   - Bridge: TCD shares urfd's network namespace via service:urfd
    #   - Host: TCD also uses host networking
    # Leave TCD_NETWORK_MODE empty for: network_mode: service:urfd
    # Set TCD_NETWORK_MODE=network_mode: host  when urfd uses host
    # ${TCD_NETWORK_MODE}
    # NOTE: When using host networking, uncomment the line above and remove
    # the 'depends_on:' section (host mode doesn't support service:urfd).
    depends_on:
      - urfd
    volumes:
      - ${INSTANCE_DIR}/config:/usr/local/etc/tcd:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: urfd-dashboard:${IMAGE_VERSION}
    container_name: ${INSTANCE_NAME}-dashboard
    command: dashboard -config /etc/dashboard/config.yaml
    ports:
      - "${PORT_DASHBOARD_HTTP}:8080/tcp"  # Dashboard HTTP
    environment:
      - URFD_HOST=${DASHBOARD_URFD_HOST:-urfd}
    # Extra hosts for host networking mode:
    # Set DASHBOARD_EXTRA_HOSTS=extra_hosts:\n      - "host.docker.internal:host-gateway"
    # ${DASHBOARD_EXTRA_HOSTS}
    # NOTE: When using host networking, uncomment the line above.
    depends_on:
      - urfd
    volumes:
      - ${INSTANCE_DIR}/config/dashboard:/etc/dashboard:ro
      - ${INSTANCE_DIR}/data/audio:/usr/local/bin/audio:ro
      - ${INSTANCE_DIR}/data/dashboard:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AllStar Nexus (optional)
  # Uncomment to enable AllStar <-> URFD bridging
  # allstar-nexus:
  #   image: urfd-allstar-nexus:${IMAGE_VERSION}
  #   container_name: ${INSTANCE_NAME}-allstar-nexus
  #   environment:
  #     - URFD_HOST=${ALLSTAR_URFD_HOST:-host.docker.internal}
  #     - URFD_PORT=${PORT_NNG_DASHBOARD}
