###### URF239 PRODUCTION CONFIGURATION ######
# Deployment for separate VM with Tailscale tunnel
# Ports offset by +1 from standard (e.g., 42001 instead of 42000)
# This file is checked into the repo as the canonical URF239 configuration.
# Secrets (SysopEmail, transmit_password) must be set via environment or
# local override before deployment.

[Names]
Callsign = URF239
SysopEmail = YOUR_EMAIL@example.com
Country = US
Sponsor = URF239 Digital Network
DashboardUrl = http://YOUR_DOMAIN:8081
Bootstrap = xrf757.openquad.net

[IP Addresses]
IPv4Binding = 0.0.0.0
# IPv6Binding = ::

[Modules]
Modules = ADMSZ
DescriptionA = Main
DescriptionD = DMR
DescriptionM = M17
DescriptionS = DStar
DescriptionZ = Experimental

[Dashboard]
Enable = true
NNGAddr = tcp://0.0.0.0:5555
Interval = 10
NNGDebug = false
ControlNNGEnable = true
ControlNNGAddr = tcp://0.0.0.0:6001

[Audio]
Enable = true
path = /usr/local/bin/audio/

[Transcoder]
Port = 10101
BindingAddress = 0.0.0.0
Modules = ADMSZ

[Voice]
Enable = true
NngAddr = tcp://0.0.0.0:5556

# Protocols (all ports offset by +1)
[Brandmeister]
Enable = false
Port = 10003

[DCS]
Port = 30052

[DExtra]
Port = 30002

[DPlus]
Port = 20002

[G3]
Enable = true

[IMRS]
Enable = false
Port = 21111

[DMRPlus]
Port = 8881

[M17]
Enable = true
Port = 17001

[MMDVM]
Port = 62031
DefaultId = 0

[NXDN]
Port = 41401
AutoLinkModule = A
ReflectorID = 12345

[P25]
Port = 41001
AutoLinkModule = A
ReflectorID = 12345

[URF]
Port = 10018

[USRP]
Enable = true
Callsign = ALLSTAR
IPAddress = 127.0.0.1
RxPort = 34001
TxPort = 32001
Module = A

[DMR]
XlxCompatibility = false
SingleMode = false
HoldTime = 5
DefaultTimeout = 600

[YSF]
Port = 42001
AutoLinkModule = A
EnableDGID = true
DefaultTxFreq = 446500000
DefaultRxFreq = 446500000
RegistrationID = 12345
RegistrationName = US URF239
RegistrationDescription = URF239 Digital Network

######## Database files
[DMR ID DB]
Mode = http
FilePath = /tmp/dmrid.dat
URL = http://xlxapi.rlx.lu/api/exportdmr.php
RefreshMin = 179

[NXDN ID DB]
Mode = http
FilePath = /tmp/nxdn.dat
URL = https://radioid.net/static/nxdn.csv
RefreshMin = 1440

[YSF TX/RX DB]
Mode = http
FilePath = /tmp/ysfnode.dat
URL = http://xlxapi.rlx.lu/api/exportysfrepeaters.php
RefreshMin = 191

######### Other File locations
[Files]
PidPath = /var/run/xlxd.pid
XmlPath = /var/log/xlxd.xml
WhitelistPath = /usr/local/etc/urfd/urfd.whitelist
BlacklistPath = /usr/local/etc/urfd/urfd.blacklist
InterlinkPath = /usr/local/etc/urfd/urfd.interlink
G3TerminalPath = /usr/local/etc/urfd/urfd.terminal
M17InterlinkPath = /usr/local/etc/urfd/urfd.m17
