server:
  addr: ":8080"
  nng_url: "tcp://host.docker.internal:5555"
  db_path: "/app/data/dashboard.db"

reflector:
  name: "URF239"
  description: "URF239 Digital Network"
  modules:
    A: "Main"
    D: "DMR"
    M: "M17"
    S: "DStar"
    Z: "Experimental"

logging:
  level: "info"
  console: true

audio:
  enable: true
  path: "/usr/local/bin/audio"

voice:
  enable: true
  reflector_addr: "tcp://host.docker.internal:5556"
  control_addr: "tcp://host.docker.internal:6556"
  transmit_password: "CHANGE_ME_TO_SECURE_PASSWORD"
  max_clients: 100
  opus_bitrate: 12000
  max_tx_duration: 120
